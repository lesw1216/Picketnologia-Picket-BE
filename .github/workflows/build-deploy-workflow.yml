name: Picket Build & Deploy to EC2 with Docker Compose
on:
  push:
    branches:
      - "dev"
    paths-ignore:
      - "./README.md"
      - "./docs"
      - "./k8s"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Java build (Gradle) ---
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Project with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar

      # --- Docker build ---

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (tag = git sha + latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/picket-backend:${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/picket-backend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy via SSH (pull & restart)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}          # ubuntu or ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            
            echo "Success SSH connection"
            
            echo "move to /home/picket"
            cd /home/picket
            
            echo "Pulling Docker Image from DockerHub, Only Backend"
            sudo docker compose pull backend

            echo "Running Docker Container that is Backend Service"
            sudo docker compose up -d --no-deps backend
            
            echo "Cleaning up unused Docker images"
            sudo docker image prune -f

            echo "Deployment completed."